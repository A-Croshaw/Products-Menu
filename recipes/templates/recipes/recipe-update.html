{% load static %}
<div class="container-fluid">
    <div class="row mt-5">
        <h1 class="text-center"> Updateing {{recipe.recipeName|title}}</h1>
        <hr>
        </hr>
    </div>
    <div class="row justify-content-center pt-sm-3">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4 ">
            <form hx-post="{% url 'recipe-update' recipe.pk%}" hx-push-url="true" hx-target="#recipe-add"
                class="form-control rounded-2 p-3 form-bg">
                {% include 'recipes/includes/recipe-form.html' %}
                <div class="row justify-content-evenly mt-4">
                    <button class="btn btn-all my-2">
                        Next
                    </button>
                    <button class="btn btn-all my-2" hx-get="{% url 'recipe-manager' %}" hx-push-url="true" hx-target="#recipe-add"
                        hx-push-url='/recipes'>
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
