    <div class="row p-0 m-0">
        <div class="col-5">
            <p class="p-0 m-0">- {{ step.steps|title }}</p>
        </div>
        <div class="col-12 col-lg-3">
            <div class="row justify-content-end p-0 m-0">
                <div class="col-6">
                    <button hx-get="{% url 'method-update' step.id %}" hx-push-url="true" hx-target="#steps{{step.id}}"
                    class="btn text-primary btn-smalls">
                    Edit
                </button>
                </div>
                <div class="col-6">
                    <button hx-post="{% url 'method-delete' step.id %}" hx-push-url="true" hx-confirm="Are you sure you want to delete this step?" hx-target="#steps{{step.id}}"
                    class="btn text-danger btn-smalls">
                    Delete
                </button>
                </div>

            </div>
        </div>
    </div>
