<form hx-post="{% url 'ingredient-update' ingredient.id%}" hx-target="#ingredient{{ingredient.id}}" id="ingredient-form"
    class="add-ingredientd-form rounded-2 p-4">
    <div class="col">
        {% for field in form %}
        <div class="row justify-content-center text-center pb-2">
            {{field.label_tag}}
        </div>
        <div class="row justify-content-center pb-2 ">
            {{field}}
        </div>
        {% endfor %}
    </div>
    <div class="row justify-content-center pb-2">
        <button type="submit" hx-post="{% url 'ingredient-update' ingredient.id %}" hx-push-url="true" class="btn btn-all mt-2">
            Submit
        </button>
    </div>
</form>
