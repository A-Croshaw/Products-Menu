{% load static %}
<div class="container-fluid pt-md-3 mt-5">
    <div class="row mt-5 mt-md-2">
        <h1 class="text-center page-headers">{{recipe.recipe|title}}</h1>
    </div>
        <div class="details col p-0 py-3">
            <div class="container-fluid">
                <h2 class="sub-headers text-center">Ingredients</h2>
                <hr>
                {% for ingredient in ingredient %}
                <div id="ingredient{{ingredient.id}}">
                    {% include "recipes/includes/ingredient-details.html" %}
                </div>
                {% endfor %}
                <form hx-post="{% url 'ingredients' pk=recipe.id %}" hx-swap="innerHTML swap:0s" hx-target="#recipe-add"
                hx-push-url="true" class="add-ingredient-form rounded-2 p-4">
                <div class="col">
                    {% for field in form %}
                    <div class="row justify-content-center text-center pb-2">
                        {{field.label_tag}}
                    </div>
                    <div class="row justify-content-center pb-2 ">
                        {{field}}
                    </div>
                    {% endfor %}
                </div>
                <div class="row justify-content-center pb-2">
                    <div class="row justify-content-evenly mt-4">
                        <button class="btn btn-all my-2">
                            Add
                        </button>
                    </div>
            </form>
            </div>
        </div>
        <div class="col">
            <div class="row py-2 justify-content-center">
                <a hx-get="{% url 'method' recipe.id %}" hx-push-url="true" hx-target="#recipe-add"
                    class="btn btn-all mt-2" rel="opener" aria-label="Click to return to recipe manager">
                    Next
                </a>
            </div>
        </div>
    </div>
</div>
